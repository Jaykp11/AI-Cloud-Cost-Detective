services:
  postgres:
    image: postgres:16
    container_name: cloud-cost-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cloud_cost_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d cloud_cost_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    external: true
    name: ai_cloud_cost_detective_postgres_data
